[package]
name = "quillfix"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "QuillFix macOS text correction menu bar app"
license = "MIT"
repository = "https://example.com/quillfix"
keywords = ["macos", "text", "correction", "menubar", "nlp"]
categories = ["text-processing", "os::macos-apis"]

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-oslog = "0.3.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

# ML model ecosystem
hf-hub = { version = "0.5.0", default-features = false, features = ["tokio", "rustls-tls"], optional = true }
mlx-rs = { version = "0.25.3", optional = true }
candle-core = { version = "0.9.2", optional = true, features = ["metal"] }
candle-nn = { version = "0.9.2", optional = true }
candle-transformers = { version = "0.9.2", optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }
safetensors = { version = "0.5.3", optional = true }

# macOS system integrations
core-foundation = "0.10.1"
core-graphics = "0.25.0"
dispatch2 = "0.3.0"
libc = "0.2"
objc2 = "0.6.3"
objc2-accessibility = "0.3.2"
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSButton",
    "NSClickGestureRecognizer",
    "NSEvent",
    "NSGestureRecognizer",
    "NSGraphics",
    "NSImage",
    "NSImageView",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSPasteboard",
    "NSResponder",
    "NSStatusBarButton",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "block2",
] }
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSGeometry",
    "NSString",
    "NSValue",
] }
objc2-quartz-core = { version = "0.3.2", features = [
    "CAAnimation",
    "CALayer",
    "CAMediaTiming",
] }
block2 = "0.6.2"

[dev-dependencies]
anyhow = "1.0.102"
assert_cmd = "2.1.1"
plist = "1.8.0"
tempfile = "3.23.0"

[features]
default = []
local-llm = [
    "dep:hf-hub",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:safetensors",
]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "debuginfo"
