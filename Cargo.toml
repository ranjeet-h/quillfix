[package]
name = "quillfix"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "QuillFix macOS text correction menu bar app"
license = "MIT"
repository = "https://example.com/quillfix"

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-oslog = "0.3.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

# ML model ecosystem
hf-hub = { version = "0.5.0", default-features = false, features = ["tokio", "rustls-tls"], optional = true }
mlx-rs = { version = "0.25.3", optional = true }

# macOS system integrations
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2 = "0.6.3"
objc2-accessibility = "0.3.2"
objc2-app-kit = "0.3.2"

[dev-dependencies]
anyhow = "1.0.102"

[features]
default = []
local-llm = ["dep:hf-hub", "dep:mlx-rs"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "debuginfo"
